<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="theme-color" content="#B9736A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23B9736A'/><stop offset='.55' stop-color='%23EE8776'/><stop offset='1' stop-color='%23E7B6AB'/></linearGradient></defs><circle cx='50' cy='50' r='46' fill='url(%23g)'/></svg>">
  {%- feed_meta -%}
</head>
<body>
  <div class="horizon" aria-hidden="true"></div>

  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-dot" aria-hidden="true"></span>{{ site.title | escape }}
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} aria-current="page"{% endif %}>Links</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>Sources</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer wrap">
    <p><span class="brand-dot" aria-hidden="true"></span>{{ site.title | escape }} — {{ site.description | escape }}</p>
    <p>
      {%- if site.twitter -%}<a href="https://twitter.com/{{ site.twitter | cgi_escape | escape }}">@{{ site.twitter | escape }}</a> · {% endif -%}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
